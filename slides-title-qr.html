<script>
// Site QR code on the title slide, for the room and for Zoom screens.
(function () {
  var t = document.getElementById('title-slide');
  if (!t) return;
  var img = document.createElement('img');
  img.src = 'images/qr-site.png';
  img.alt = 'QR code for jimclifford.ca/imperial-careers-workshop';
  img.className = 'workshop-title-qr';
  img.style.cssText = 'display:block;width:190px;height:190px;margin:0';
  var link = document.createElement('a');
  link.href = 'https://jimclifford.ca/imperial-careers-workshop/';
  link.target = '_blank';
  link.rel = 'noopener';
  link.className = 'workshop-title-qr-link';
  link.style.cssText = 'position:absolute;right:0;bottom:40px;z-index:20;display:block';
  link.appendChild(img);
  t.appendChild(link);
})();
</script>
